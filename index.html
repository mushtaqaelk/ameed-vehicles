<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>نظام العميد الإلكتروني لمتابعة العجلات</title>
<meta name="theme-color" content="#0B5D4C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="عجلات العميد">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/logo-light.png">
<link rel="apple-touch-icon" href="assets/logo-light.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Tajawal:wght@400;500;700;900&display=swap">

<!--
  ====================================================================
  خطوات التشغيل (التفاصيل الكاملة في README.md):
  1) أنشئ مشروع Firebase جديداً باسم ameed-vehicles.
  2) فعّل Authentication > Sign-in method > Email/Password.
  3) فعّل Firestore Database، ثم انسخ محتوى الملف firestore.rules إلى
     تبويب Rules واضغط Publish.
  4) أضف "تطبيق ويب" وانسخ القيم إلى المتغير firebaseConfig أدناه.
  5) افتح الصفحة: ستظهر شاشة "إنشاء حساب مدير النظام الأول".
  ما دام firebaseConfig غير مُعدّ، يعمل النظام في "وضع العرض التجريبي"
  على قاعدة بيانات محلية داخل المتصفح، ببيانات تجريبية.
  ====================================================================
-->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#F6F3EC; --surface:#FFFFFF; --surface-2:#FBF9F4; --surface-3:#F0ECE1;
  --ink:#1C2624; --ink-soft:#5B6862; --ink-faint:#8A958F;
  --border:#E2DDCE; --border-strong:#CFC8B4;
  --accent:#0B5D4C; --accent-strong:#08483B; --accent-soft:#E3EFE9; --accent-ink:#06392E;
  --free:#1E8A5F; --free-soft:#E3F3EA;
  --busy:#B23A3A; --busy-soft:#FBEAEA;
  --pending:#A5750A; --pending-soft:#FBF1DC;
  --rejected:#7C7466; --rejected-soft:#EFEBE2;
  --info:#2D5F9A; --info-soft:#E4EDF8;
  --shadow-sm:0 1px 2px rgba(20,30,28,.07);
  --shadow-md:0 10px 28px -12px rgba(20,30,28,.22);
  --radius:14px; --radius-sm:9px;
  --font-display:'Amiri','Noto Naskh Arabic',serif;
  --font-body:'Tajawal','Segoe UI',sans-serif;
  --logo-light:url("assets/logo-light.png");
  --logo-dark:url("assets/logo-dark.png");
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#182220; --surface-2:#1C2724; --surface-3:#20302B;
    --ink:#ECE9DE; --ink-soft:#A9B3AE; --ink-faint:#78847E;
    --border:#2A3532; --border-strong:#374440;
    --accent:#3FB393; --accent-strong:#57C7A6; --accent-soft:#1C332C; --accent-ink:#8FE2C6;
    --free:#3FB393; --free-soft:#17332A;
    --busy:#E0897C; --busy-soft:#3A211F;
    --pending:#E0B94D; --pending-soft:#3A2F15;
    --rejected:#9AA39D; --rejected-soft:#242C29;
    --info:#8DB6E8; --info-soft:#1D2A3A;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 14px 32px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#182220; --surface-2:#1C2724; --surface-3:#20302B;
  --ink:#ECE9DE; --ink-soft:#A9B3AE; --ink-faint:#78847E;
  --border:#2A3532; --border-strong:#374440;
  --accent:#3FB393; --accent-strong:#57C7A6; --accent-soft:#1C332C; --accent-ink:#8FE2C6;
  --free:#3FB393; --free-soft:#17332A;
  --busy:#E0897C; --busy-soft:#3A211F;
  --pending:#E0B94D; --pending-soft:#3A2F15;
  --rejected:#9AA39D; --rejected-soft:#242C29;
  --info:#8DB6E8; --info-soft:#1D2A3A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 14px 32px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html{background:var(--bg); -webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-body);
}
#app{
  direction:rtl; unicode-bidi:isolate; text-align:right;
  min-height:100%; padding:16px 16px 64px; max-width:1180px; margin:0 auto;
  display:flex; flex-direction:column; gap:18px;
}
h1,h2,h3{font-family:var(--font-display); text-wrap:balance; margin:0; color:var(--ink);}
p{margin:0;}
button{font-family:inherit;}
::selection{background:var(--accent-soft); color:var(--accent-ink);}
.num, .plate{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate;}

/* ---------- top bar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  flex-wrap:wrap; padding-block:4px;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand-mark{flex:none; width:46px; height:46px; background-size:contain; background-repeat:no-repeat; background-position:center;}
.brand-mark-light{background-image:var(--logo-light);}
.brand-mark-dark{background-image:var(--logo-dark); display:none;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .brand-mark-light{ display:none; }
  :root:not([data-theme="light"]) .brand-mark-dark{ display:block; }
}
:root[data-theme="dark"] .brand-mark-light{ display:none; }
:root[data-theme="dark"] .brand-mark-dark{ display:block; }
.brand-text .eyebrow{
  font-size:12.5px; letter-spacing:.06em; color:var(--ink-soft); font-weight:500;
}
.brand-text h1{font-size:21px; line-height:1.25; margin-top:2px;}
.session{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.role-pill{
  display:inline-flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:999px; padding:7px 14px;
  font-size:13.5px; color:var(--ink-soft); box-shadow:var(--shadow-sm);
}
.role-pill strong{color:var(--ink); font-weight:700;}
.dot{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none;}
.dot.offline{background:var(--busy);}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
  border-radius:10px; padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer;
  min-height:42px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  transition:transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:hover{border-color:var(--accent);}
.btn:active{transform:scale(.97);}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-soft);}
.btn-ghost:hover{color:var(--accent); border-color:var(--border);}
.btn-danger{color:var(--busy); border-color:var(--busy-soft);}
.btn-danger:hover{background:var(--busy-soft); border-color:var(--busy);}
.btn-ok{color:var(--free); border-color:var(--free-soft);}
.btn-ok:hover{background:var(--free-soft); border-color:var(--free);}
.btn-sm{padding:6px 12px; font-size:12.5px; border-radius:8px; min-height:34px;}
.btn-lg{padding:14px 20px; font-size:16px; min-height:54px; border-radius:12px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:6px; border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  background:transparent; border:none; border-bottom:2.5px solid transparent; white-space:nowrap;
  padding:11px 8px; margin-bottom:-1px; font-size:14.5px; font-weight:700;
  color:var(--ink-faint); cursor:pointer; display:inline-flex; align-items:center; gap:6px;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--accent-strong); border-bottom-color:var(--accent);}
.tab-count{
  background:var(--busy); color:#fff; border-radius:999px; font-size:11px; font-weight:800;
  min-width:19px; height:19px; padding:0 5px; display:inline-flex; align-items:center; justify-content:center;
}

/* ---------- generic ---------- */
.panel{display:flex; flex-direction:column; gap:16px;}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:12px;
}
.card h2{font-size:17px;}
.card h3{font-size:15px;}
.muted{color:var(--ink-soft); font-size:13.5px;}
.faint{color:var(--ink-faint); font-size:12.5px;}
.row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.stack{display:flex; flex-direction:column; gap:8px;}
hr.sep{border:none; border-top:1px solid var(--border); margin:2px 0; width:100%;}
.grow{flex:1; min-width:0;}

/* ---------- stats ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px;}
.stat-tile{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; gap:4px;
  border-inline-start:4px solid var(--border-strong); text-align:inherit; cursor:default;
}
button.stat-tile{cursor:pointer; font-family:inherit; color:inherit;}
.stat-tile[data-tone="free"]{border-inline-start-color:var(--free);}
.stat-tile[data-tone="busy"]{border-inline-start-color:var(--busy);}
.stat-tile[data-tone="pending"]{border-inline-start-color:var(--pending);}
.stat-tile[data-tone="info"]{border-inline-start-color:var(--info);}
.stat-tile .v{font-size:28px; font-weight:900; font-variant-numeric:tabular-nums; color:var(--ink);}
.stat-tile .l{font-size:13px; color:var(--ink-soft); font-weight:700;}

/* ---------- vehicle / live grid ---------- */
.grid-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px;}
.v-card{
  border:1px solid var(--border); border-radius:var(--radius); padding:13px 15px;
  background:var(--surface); display:flex; flex-direction:column; gap:7px;
  border-inline-start:4px solid var(--border-strong);
}
.v-card[data-status="in"]{border-inline-start-color:var(--free);}
.v-card[data-status="out"]{border-inline-start-color:var(--info);}
.v-card[data-status="late"]{border-inline-start-color:var(--busy);}
.v-card[data-status="maint"]{border-inline-start-color:var(--pending);}
.v-head{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.v-plate{font-weight:900; font-size:16px;}
.v-detail{font-size:13px; color:var(--ink-soft); line-height:1.65;}
.v-detail b{color:var(--ink); font-weight:700;}
.status-pill{
  font-size:11.5px; font-weight:800; padding:3px 10px; border-radius:999px; white-space:nowrap;
  background:var(--surface-3); color:var(--ink-soft);
}
.status-pill.free, .status-pill.done, .status-pill.in, .status-pill.active{background:var(--free-soft); color:var(--free);}
.status-pill.busy, .status-pill.late, .status-pill.broken{background:var(--busy-soft); color:var(--busy);}
.status-pill.pending, .status-pill.new, .status-pill.maintenance, .status-pill.awaiting_finance{background:var(--pending-soft); color:var(--pending);}
.status-pill.rejected{background:var(--rejected-soft); color:var(--rejected);}
.status-pill.out, .status-pill.approved, .status-pill.in_progress{background:var(--info-soft); color:var(--info);}
.group-title{font-weight:800; font-size:14px; color:var(--accent-strong); margin-top:4px;}

/* ---------- alerts ---------- */
.alert{
  border-radius:var(--radius-sm); padding:10px 12px; font-size:13.5px; display:flex; gap:8px; align-items:flex-start;
  background:var(--pending-soft); color:var(--ink); border:1px solid transparent;
}
.alert.danger{background:var(--busy-soft);}
.alert.info{background:var(--info-soft);}
.alert b{font-weight:800;}
.alert .ic{flex:none;}

/* ---------- chips ---------- */
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-soft);
  border-radius:999px; padding:8px 15px; font-size:13.5px; font-weight:700; cursor:pointer; min-height:38px;
}
.chip:hover{color:var(--ink);}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ---------- forms ---------- */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px;}
.field{display:flex; flex-direction:column; gap:5px; min-width:0;}
.field.full{grid-column:1/-1;}
.field label{font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.field .help{font-size:11.5px; color:var(--ink-faint);}
.field input, .field select, .field textarea, .input{
  font-family:inherit; font-size:16px; padding:10px 12px; border-radius:9px; min-height:44px; width:100%;
  border:1px solid var(--border-strong); background:var(--surface-2); color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus, .input:focus{
  outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent);
}
.field textarea{resize:vertical; min-height:64px;}
.checks{display:flex; flex-wrap:wrap; gap:8px;}
.checks label{
  display:inline-flex; gap:6px; align-items:center; font-size:14px; color:var(--ink); font-weight:500;
  border:1px solid var(--border-strong); border-radius:9px; padding:8px 12px; background:var(--surface-2);
}
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px;}
.seg button{
  border:2px solid var(--border-strong); background:var(--surface-2); color:var(--ink-soft);
  border-radius:12px; padding:14px 8px; font-size:17px; font-weight:900; cursor:pointer; min-height:58px;
}
.seg button.on-out{border-color:var(--info); background:var(--info-soft); color:var(--info);}
.seg button.on-in{border-color:var(--free); background:var(--free-soft); color:var(--free);}
.seg button.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink);}

/* ---------- list items ---------- */
.item{
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px;
  background:var(--surface); display:flex; flex-direction:column; gap:8px;
}
.item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;}
.item-title{font-weight:800; font-size:14.5px;}
.item-meta{font-size:12.8px; color:var(--ink-soft); display:flex; gap:6px 14px; flex-wrap:wrap;}
.item-meta b{color:var(--ink);}
.item-note{font-size:12.5px; color:var(--ink-soft); background:var(--surface-3); border-radius:8px; padding:6px 10px;}
.item-actions{display:flex; gap:8px; flex-wrap:wrap;}
.badge{
  font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent-ink);
}
.timeline{font-size:12px; color:var(--ink-faint); display:flex; flex-direction:column; gap:3px; border-inline-start:2px solid var(--border); padding-inline-start:10px;}
details summary{cursor:pointer; font-size:12.5px; color:var(--ink-soft); font-weight:700;}
.stars{color:var(--pending); letter-spacing:1px;}
.rank{
  width:30px; height:30px; flex:none; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink);
  display:inline-flex; align-items:center; justify-content:center; font-weight:900; font-size:14px;
}
.points{font-size:22px; font-weight:900; font-variant-numeric:tabular-nums;}
.points.low{color:var(--busy);} .points.mid{color:var(--pending);} .points.high{color:var(--free);}
.photo{max-width:100%; max-height:260px; border-radius:var(--radius-sm); border:1px solid var(--border); object-fit:contain; background:var(--surface-2);}
.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:13.5px;}
.kv dt{color:var(--ink-soft); font-weight:700;}
.kv dd{margin:0;}

/* ---------- modal / toast ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(10,15,14,.45); display:flex; align-items:center;
  justify-content:center; padding:16px; z-index:50;
}
.modal{
  background:var(--surface); border-radius:var(--radius); padding:20px; width:100%; max-width:440px;
  box-shadow:var(--shadow-md); display:flex; flex-direction:column; gap:14px;
  max-height:calc(100vh - 32px); overflow-y:auto; direction:rtl; text-align:right;
}
.modal.modal-wide{max-width:720px;}
.modal h3{font-size:18px;}
.modal-head{display:flex; justify-content:space-between; align-items:center; gap:10px;}
@media (max-width:560px){
  .modal-backdrop{padding:0; align-items:flex-end;}
  .modal, .modal.modal-wide{max-width:none; border-radius:var(--radius) var(--radius) 0 0; max-height:92vh;}
}
.error-text{color:var(--busy); font-size:13px; font-weight:700;}
.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--surface); padding:11px 20px; border-radius:999px;
  font-size:13.5px; font-weight:700; box-shadow:var(--shadow-md); z-index:60; max-width:calc(100vw - 32px); text-align:center;
}
@media (prefers-reduced-motion:no-preference){
  .modal{animation:pop .15s ease;}
}
@keyframes pop{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}
.warn-box{
  background:var(--pending-soft); color:var(--pending); border:1px solid var(--pending);
  border-radius:9px; padding:10px 12px; font-size:13px; display:flex; flex-direction:column; gap:8px;
}
.demo-banner{
  background:var(--info-soft); color:var(--info); border:1px solid var(--info); border-radius:var(--radius-sm);
  padding:10px 14px; font-size:13px; font-weight:700;
}
.footnote{
  text-align:center; color:var(--ink-faint); font-size:12px; padding-top:6px; line-height:1.7;
}
[hidden]{display:none !important;}

/* ---------- login ---------- */
.login-wrap{max-width:420px; width:100%; margin:20px auto 0;}
.demo-users{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}

/* ---------- tables ---------- */
.file-drop{
  border:1.5px dashed var(--border-strong); border-radius:var(--radius-sm); padding:14px 16px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--surface-2);
}
.table-scroll{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius-sm);}
table.data-table{border-collapse:collapse; width:100%; font-size:13px;}
table.data-table th, table.data-table td{
  padding:8px 10px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap;
}
table.data-table th{background:var(--surface-2); color:var(--ink-soft); font-weight:800; font-size:12.5px;}
table.data-table tr.row-error td{background:var(--busy-soft);}
table.data-table tr.row-warn td{background:var(--pending-soft);}
table.data-table tfoot td{font-weight:800; background:var(--surface-2);}

/* ---------- reports ---------- */
.report-sheet{display:flex; flex-direction:column; gap:16px;}
.report-head{display:flex; align-items:center; gap:14px; border-bottom:2px solid var(--accent); padding-bottom:12px;}
.report-titles{display:flex; flex-direction:column; gap:2px;}
.report-univ{font-family:var(--font-display); font-size:20px; font-weight:700; color:var(--ink);}
.report-sub{font-size:12.5px; color:var(--ink-soft);}
.report-title{font-size:15px; font-weight:800; color:var(--accent-strong); margin-top:4px;}
.report-meta{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13.5px; color:var(--ink);}
.report-meta b{color:var(--ink-soft); font-weight:700;}
.report-stats{display:flex; gap:12px; flex-wrap:wrap;}
.stat-box{
  flex:1; min-width:130px; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px 14px; text-align:center;
}
.stat-box.stat-total{background:var(--accent-soft); border-color:var(--accent);}
.stat-num{font-size:20px; font-weight:900; color:var(--accent-strong); font-variant-numeric:tabular-nums;}
.stat-label{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.report-section-title{font-size:14.5px; font-weight:800; color:var(--ink); margin-top:4px;}
.report-sign{display:flex; justify-content:space-between; gap:20px; margin-top:26px; font-size:13px; color:var(--ink-soft);}
.report-sign div{flex:1; text-align:center; border-top:1px dashed var(--border-strong); padding-top:8px;}

@media print{
  body *{ visibility:hidden; }
  #printableReport, #printableReport *{ visibility:visible; }
  #printableReport{ position:absolute; inset-inline-start:0; top:0; width:100%; border:none !important; box-shadow:none !important; }
  .no-print{ display:none !important; }
  .report-univ, .report-title, .stat-num{ color:#000 !important; }
  .stat-box{ background:#fff !important; border:1px solid #999 !important; }
  .report-head{ border-bottom-color:#000 !important; }
  table.data-table{ width:100% !important; font-size:11px !important; }
  table.data-table th, table.data-table td{ white-space:normal !important; padding:5px 6px !important; }
  .table-scroll{ overflow:visible !important; }
  @page{ size:landscape; margin:12mm; }
  .report-logo-light{ display:block !important; }
  .report-logo-dark{ display:none !important; }
}
.report-logo-light, .report-logo-dark{
  width:52px; height:52px; flex:none; object-fit:contain;
}
.report-logo-dark{ display:none; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .report-logo-light{ display:none; }
  :root:not([data-theme="light"]) .report-logo-dark{ display:block; }
}
:root[data-theme="dark"] .report-logo-light{ display:none; }
:root[data-theme="dark"] .report-logo-dark{ display:block; }

@media (max-width:560px){
  #app{padding:12px 12px 56px; gap:14px;}
  .brand-text h1{font-size:18px;}
  .brand-text .eyebrow{font-size:11.5px;}
  .card{padding:14px;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .stat-tile .v{font-size:24px;}
}

<script>
(function(){
  "use strict";

  /* ====================================================================
     الصق هنا إعدادات مشروع Firebase (Project settings > General >
     Your apps > SDK setup and configuration > Config).
     ما دام apiKey يبدأ بـ PASTE_ يعمل النظام في وضع العرض التجريبي.
     ==================================================================== */
  var firebaseConfig = {
    apiKey: "PASTE_API_KEY",
    authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
    projectId: "PASTE_PROJECT_ID",
    storageBucket: "PASTE_PROJECT_ID.firebasestorage.app",
    messagingSenderId: "PASTE_SENDER_ID",
    appId: "PASTE_APP_ID"
  };

  var DEMO = !firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('PASTE_') === 0 || /[?&]demo=1\b/.test(location.search);
  var EMAIL_DOMAIN = 'ameed-vehicles.app';

  var DEFAULT_SETTINGS = {
    overdueHours: 12,       // تنبيه العجلة الخارجة منذ أكثر من X ساعة
    expiryWarnDays: 30,     // تنبيه قرب انتهاء السنوية والتأمين
    oilChangeKm: 5000,      // تبديل الدهن كل X كم
    fuelOverusePct: 25,     // نسبة زيادة الاستهلاك عن معدل العجلة التي تُعدّ مخالفة
    startPoints: 100,       // رصيد السائق الشهري
    latePenalty: 5,         // خصم تأخر إرجاع العجلة
    fuelPenalty: 5          // خصم زيادة استهلاك الوقود
  };
  var DEFAULT_LOCATIONS = [
    {id:'gate-main', name:'البوابة الرئيسية'},
    {id:'gate-back', name:'البوابة الخلفية'},
    {id:'garage', name:'مرآب الجامعة'}
  ];

  var ROLES = ['admin','fleet','gate','finance','driver','viewer'];
  var ROLE_LABEL = {admin:'مدير النظام', fleet:'مدير الآليات', gate:'الاستعلامات', finance:'المالية', driver:'سائق', viewer:'الإدارة العليا'};
  var REQ_TYPE = {fuel:'وقود', maintenance:'صيانة', wash:'غسل وتنظيف'};
  var REQ_ICON = {fuel:'⛽', maintenance:'🔧', wash:'🧽'};
  var STATUS_LABEL = {'new':'جديد', approved:'موافق عليه', in_progress:'قيد التنفيذ', awaiting_finance:'بانتظار المالية', done:'منجز', rejected:'مرفوض'};
  var OPEN_STATUSES = ['new','approved','in_progress','awaiting_finance'];
  var FUEL_LABEL = {petrol:'بنزين', diesel:'كاز'};
  var PAY_LABEL = {cash:'نقداً مع استرداد', coupon:'كوبونات', account:'حساب لدى المحطة'};
  var VSTATUS_LABEL = {active:'فعّالة', maintenance:'في الصيانة', broken:'عاطلة'};
  var WASH_KIND = {wash:'غسل خارجي', clean:'تنظيف داخلي', both:'غسل وتنظيف'};
  var MONTH_AR = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];

  /* ---------------- DOM helpers ---------------- */
  function $(id){ return document.getElementById(id); }
  var PROP_ATTRS = {value:1, checked:1, selected:1, disabled:1, hidden:1, required:1, multiple:1, readOnly:1};
  function el(tag, attrs, children){
    var n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if(v === undefined || v === null || v === false && !PROP_ATTRS[k]) return;
      if(k === 'class') n.className = v;
      else if(k === 'html') n.innerHTML = v;
      else if(k === 'text') n.textContent = v;
      else if(k === 'style' && typeof v === 'object') Object.keys(v).forEach(function(s){ n.style[s] = v[s]; });
      else if(k.indexOf('on') === 0 && typeof v === 'function') n.addEventListener(k.slice(2), v);
      else if(PROP_ATTRS[k]) n[k] = v;
      else n.setAttribute(k, v);
    });
    appendKids(n, children);
    return n;
  }
  function appendKids(n, children){
    (children||[]).forEach(function(c){
      if(c === null || c === undefined || c === false) return;
      if(Array.isArray(c)) appendKids(n, c);
      else if(typeof c === 'string' || typeof c === 'number') n.appendChild(document.createTextNode(String(c)));
      else n.appendChild(c);
    });
  }
  function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); return n; }
  function pill(cls, text){ return el('span',{class:'status-pill '+(cls||''), text:text}); }

  /* ---------------- formatting (أرقام غربية) ---------------- */
  function pad(n){ return String(n).padStart(2,'0'); }
  function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
  function fmtNum(v, digits){
    return num(v).toLocaleString('en-US', {maximumFractionDigits: digits === undefined ? 0 : digits});
  }
  function fmtIQD(v){ return fmtNum(Math.round(num(v))) + ' د.ع'; }
  function toDate(v){ if(!v) return null; var d = v instanceof Date ? v : new Date(v); return isNaN(d) ? null : d; }
  function fmtISODate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  // التواريخ تُعزل باتجاه LTR (LRI…PDI) حتى لا تنقلب داخل الجمل العربية
  function ltr(s){ return '\u2066'+s+'\u2069'; }
  function stripIsolates(s){ return typeof s === 'string' ? s.replace(/[\u2066-\u2069]/g,'') : s; }
  function fmtDate(v){ var d = toDate(v); return d ? ltr(fmtISODate(d)) : '—'; }
  function fmtTime(v){ var d = toDate(v); return d ? ltr(pad(d.getHours())+':'+pad(d.getMinutes())) : '—'; }
  function fmtDT(v){ var d = toDate(v); return d ? ltr(fmtISODate(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes())) : '—'; }
  function fmtDuration(ms){
    if(!(ms >= 0)) return '—';
    var mins = Math.floor(ms/60000), h = Math.floor(mins/60), m = mins%60;
    if(h >= 48) return Math.floor(h/24)+' يوم و'+(h%24)+' س';
    if(h > 0) return h+' س '+m+' د';
    return m+' د';
  }
  function monthKey(v){ var d = toDate(v); return d ? d.getFullYear()+'-'+pad(d.getMonth()+1) : ''; }
  function monthLabel(key){ var p = String(key).split('-'); return MONTH_AR[Number(p[1])-1]+' '+p[0]; }
  function nowISO(){ return new Date().toISOString(); }
  function daysUntil(dateStr){
    var d = toDate(dateStr); if(!d) return null;
    var t = new Date(); t.setHours(0,0,0,0); d.setHours(0,0,0,0);
    return Math.round((d - t)/86400000);
  }
  function startOfDay(s){ var d = toDate(s); d.setHours(0,0,0,0); return d; }
  function endOfDay(s){ var d = toDate(s); d.setHours(23,59,59,999); return d; }
  function inRange(v, from, to){ var d = toDate(v); return !!d && d >= from && d <= to; }
  function uid(prefix){ return (prefix||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function slug(s){ return String(s||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^\w؀-ۿ-]/g,'') || uid('loc'); }
  function normName(s){ return String(s||'').trim().replace(/\s+/g,' ').replace(/[أإآ]/g,'ا').replace(/ة$/,'ه').toLowerCase(); }

  function showToast(msg){
    var root = $('toastRoot');
    clear(root);
    var t = el('div',{class:'toast', role:'status', text:msg});
    root.appendChild(t);
    setTimeout(function(){ if(root.contains(t)) root.removeChild(t); }, 3400);
  }

  /* ====================================================================
     قاعدة بيانات تجريبية داخل المتصفح (تحاكي الجزء المستخدم من Firebase
     compat SDK). تُستخدم في وضع العرض التجريبي وفي الاختبارات فقط.
     ==================================================================== */
  function makeDemoFirebase(){
    var KEY = 'ameed_vehicles_demo_db_v1', AUTH_KEY = 'ameed_vehicles_demo_auth_v1';
    var store = null;
    try{ store = JSON.parse(localStorage.getItem(KEY) || 'null'); }catch(e){}
    if(!store || !store.cols) store = {cols:{}, auth:{}};
    function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
    function clone(o){ return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }
    function col(name){ return store.cols[name] || (store.cols[name] = {}); }
    function newId(){ return 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
    var listeners = [], dirty = {}, scheduled = false;
    function docSnap(name, id){
      var d = col(name)[id];
      return {id:id, exists:d !== undefined, data:function(){ return clone(d); }, ref:docRef(name, id)};
    }
    function colSnap(name){
      var docs = Object.keys(col(name)).map(function(id){ return docSnap(name, id); });
      return {docs:docs, size:docs.length, empty:!docs.length, forEach:function(f){ docs.forEach(f); }};
    }
    function fire(l){ try{ l.cb(l.docId != null ? docSnap(l.col, l.docId) : colSnap(l.col)); }catch(e){ console.error(e); } }
    function notify(name){
      dirty[name] = true;
      if(scheduled) return;
      scheduled = true;
      setTimeout(function(){
        scheduled = false; var d = dirty; dirty = {}; persist();
        listeners.slice().forEach(function(l){ if(d[l.col]) fire(l); });
      }, 0);
    }
    function listen(l){
      listeners.push(l); setTimeout(function(){ fire(l); }, 0);
      return function(){ var i = listeners.indexOf(l); if(i >= 0) listeners.splice(i,1); };
    }
    function docRef(name, id){
      return {
        id:id,
        get:function(){ return Promise.resolve(docSnap(name, id)); },
        set:function(data, opts){
          var c = col(name);
          if(opts && opts.merge && c[id]) Object.keys(data).forEach(function(k){ c[id][k] = clone(data[k]); });
          else c[id] = clone(data);
          notify(name); return Promise.resolve();
        },
        update:function(data){
          var c = col(name);
          if(!c[id]) return Promise.reject(new Error('not-found'));
          Object.keys(data).forEach(function(k){ c[id][k] = clone(data[k]); });
          notify(name); return Promise.resolve();
        },
        'delete':function(){ delete col(name)[id]; notify(name); return Promise.resolve(); },
        onSnapshot:function(cb){ return listen({col:name, docId:id, cb:cb}); }
      };
    }
    function colRef(name){
      return {
        doc:function(id){ return docRef(name, id || newId()); },
        add:function(data){ var id = newId(); col(name)[id] = clone(data); notify(name); return Promise.resolve(docRef(name, id)); },
        get:function(){ return Promise.resolve(colSnap(name)); },
        onSnapshot:function(cb){ return listen({col:name, docId:null, cb:cb}); }
      };
    }
    var db = {
      collection:colRef,
      doc:function(path){ var p = path.split('/'); return docRef(p[0], p[1]); },
      batch:function(){
        var ops = [];
        return {
          set:function(r,d,o){ ops.push(function(){ r.set(d,o); }); },
          update:function(r,d){ ops.push(function(){ r.update(d); }); },
          'delete':function(r){ ops.push(function(){ r['delete'](); }); },
          commit:function(){ ops.forEach(function(f){ f(); }); return Promise.resolve(); }
        };
      },
      enablePersistence:function(){ return Promise.resolve(); }
    };
    function authErr(code){ var e = new Error(code); e.code = code; return e; }
    function makeAuth(primary){
      var current = null, subs = [];
      if(primary){ try{ current = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); }catch(e){} }
      function setUser(u){
        current = u;
        if(primary){ try{ localStorage.setItem(AUTH_KEY, JSON.stringify(u)); }catch(e){} }
        subs.forEach(function(cb){ setTimeout(function(){ cb(current); }, 0); });
      }
      return {
        get currentUser(){ return current; },
        onAuthStateChanged:function(cb){ subs.push(cb); setTimeout(function(){ cb(current); }, 0); return function(){}; },
        signInWithEmailAndPassword:function(email, pw){
          var a = store.auth[String(email).toLowerCase()];
          if(!a || a.password !== pw) return Promise.reject(authErr('auth/invalid-credential'));
          setUser({uid:a.uid, email:String(email).toLowerCase()});
          return Promise.resolve({user:current});
        },
        createUserWithEmailAndPassword:function(email, pw){
          email = String(email).toLowerCase();
          if(store.auth[email]) return Promise.reject(authErr('auth/email-already-in-use'));
          if(String(pw).length < 6) return Promise.reject(authErr('auth/weak-password'));
          var u = {uid:'u'+newId(), email:email};
          store.auth[email] = {uid:u.uid, password:pw}; persist();
          setUser(u);
          return Promise.resolve({user:u});
        },
        signOut:function(){ setUser(null); return Promise.resolve(); }
      };
    }
    var apps = {};
    function makeApp(name){
      var auth = makeAuth(name === '[DEFAULT]');
      return {name:name, auth:function(){ return auth; }, firestore:function(){ return db; }, 'delete':function(){ delete apps[name]; return Promise.resolve(); }};
    }
    return {
      _demo:true,
      _store:function(){ return store; },
      _reset:function(){ store = {cols:{}, auth:{}}; persist(); try{ localStorage.removeItem(AUTH_KEY); }catch(e){} },
      _setAuthUser:function(email, uid, pw){ store.auth[email] = {uid:uid, password:pw}; persist(); },
      get apps(){ return Object.keys(apps).map(function(k){ return apps[k]; }); },
      initializeApp:function(cfg, name){ name = name || '[DEFAULT]'; return apps[name] || (apps[name] = makeApp(name)); },
      app:function(name){ return apps[name || '[DEFAULT]']; }
    };
  }

  /* ---------------- state ---------------- */
  var FB = null, app = null, auth = null, db = null;
  var S = {
    authUser:null, profile:null, profileLoaded:false,
    config:null, configLoaded:false,
    users:[], vehicles:[], drivers:[], movements:[], requests:[], points:[], audit:[],
    tab:'home', unsub:[]
  };
  var derived = null; // يُعاد حسابه عند كل تغيير في البيانات
  var tabState = {requestsFilter:'mine', requestsType:'', vehiclesFilter:'all', vehiclesSearch:'', pointsMonth:monthKey(new Date()), financeMonth:monthKey(new Date()), reportType:'vehicle'};

  function settings(){ var s = {}; var c = (S.config && S.config.settings) || {}; Object.keys(DEFAULT_SETTINGS).forEach(function(k){ s[k] = c[k] !== undefined && c[k] !== '' ? num(c[k]) : DEFAULT_SETTINGS[k]; }); return s; }
  function locations(){ return (S.config && S.config.locations && S.config.locations.length) ? S.config.locations : DEFAULT_LOCATIONS; }
  function locationName(id){ var l = locations().find(function(x){ return x.id === id; }); return l ? l.name : (id || '—'); }
  function vehicleById(id){ return derived && derived.vehicleMap[id] || null; }
  function driverById(id){ return derived && derived.driverMap[id] || null; }
  function plateText(v){ return v ? (v.plate + (v.province ? ' — '+v.province : '')) : '—'; }
  function vehicleLabel(v){ return v ? v.plate + ' · ' + [v.make, v.model].filter(Boolean).join(' ') : 'عجلة محذوفة'; }
  function driverLabel(id, name){ var d = id && driverById(id); return d ? d.name : (name || '—'); }

  /* ---------------- permissions ---------------- */
  function role(){ return S.profile ? S.profile.role : null; }
  function isAdmin(){ return role() === 'admin'; }
  function isFleet(){ return role() === 'admin' || role() === 'fleet'; }
  function isFinance(){ return role() === 'admin' || role() === 'finance'; }
  function canRecordMovement(){ return ['admin','fleet','gate'].indexOf(role()) >= 0; }
  function canCreateRequest(){ return ['admin','fleet','driver'].indexOf(role()) >= 0; }
  function allowedLocations(){
    if(role() === 'gate') return locations().filter(function(l){ return (S.profile.locations||[]).indexOf(l.id) >= 0; });
    return locations();
  }
  function tabsForRole(){
    var all = {
      admin:['home','gate','requests','vehicles','drivers','finance','reports','admin'],
      fleet:['home','gate','requests','vehicles','drivers','reports'],
      gate:['home','gate'],
      finance:['home','requests','finance','reports'],
      driver:['home','requests'],
      viewer:['home','vehicles','drivers','finance','reports']
    };
    return all[role()] || ['home'];
  }
  var TAB_LABEL = {home:'الرئيسية', gate:'الحركة', requests:'الطلبات', vehicles:'العجلات', drivers:'السائقون', finance:'المالية', reports:'التقارير', admin:'الإدارة'};

  /* هل الطلب ينتظر إجراءً من المستخدم الحالي؟ */
  function awaitsMe(r){
    var rl = role();
    if(r.status === 'awaiting_finance') return rl === 'finance' || rl === 'admin';
    if(r.status === 'new' || r.status === 'approved' || r.status === 'in_progress') return rl === 'fleet' || rl === 'admin';
    return false;
  }
  function isMyRequest(r){
    if(!S.profile) return false;
    return r.createdBy === S.authUser.uid || (S.profile.driverId && r.driverId === S.profile.driverId);
  }
  function visibleRequests(){
    if(role() === 'driver') return S.requests.filter(isMyRequest);
    return S.requests;
  }
  function pendingCountForMe(){
    if(role() === 'driver') return visibleRequests().filter(function(r){ return OPEN_STATUSES.indexOf(r.status) >= 0; }).length;
    return S.requests.filter(awaitsMe).length;
  }

  /* ---------------- derived data ---------------- */
  function computeDerived(){
    var st = settings(), now = Date.now(), overdueMs = st.overdueHours*3600000;
    var vehicleMap = {}, driverMap = {};
    S.vehicles.forEach(function(v){ vehicleMap[v.id] = v; });
    S.drivers.forEach(function(d){ driverMap[d.id] = d; });

    var movs = S.movements.slice().sort(function(a,b){ return String(a.at).localeCompare(String(b.at)); });
    var byVehicle = {};
    movs.forEach(function(m){ (byVehicle[m.vehicleId] = byVehicle[m.vehicleId] || []).push(m); });

    // الرحلات: كل خروج مع أول دخول بعده للعجلة نفسها
    var trips = [], lastMov = {};
    Object.keys(byVehicle).forEach(function(vid){
      var list = byVehicle[vid], open = null;
      list.forEach(function(m){
        if(m.direction === 'out'){
          if(open) trips.push(open);
          open = {vehicleId:vid, driverId:m.driverId||'', driverName:m.driverName||'', outAt:m.at, outLoc:m.locationId, purpose:m.purpose||'', outOdo:m.odometer||null, inAt:null, inLoc:null, inOdo:null, demo:!!m.demo};
        } else if(m.direction === 'in'){
          if(open){ open.inAt = m.at; open.inLoc = m.locationId; open.inOdo = m.odometer||null; trips.push(open); open = null; }
        }
      });
      if(open) trips.push(open);
      lastMov[vid] = list[list.length-1];
    });
    trips.forEach(function(t){
      var end = t.inAt ? toDate(t.inAt).getTime() : now;
      t.durationMs = end - toDate(t.outAt).getTime();
      t.late = t.durationMs > overdueMs;
      t.km = (t.inOdo && t.outOdo && t.inOdo > t.outOdo) ? t.inOdo - t.outOdo : null;
    });

    // الحالة الآنية لكل عجلة
    var live = {};
    S.vehicles.forEach(function(v){
      var m = lastMov[v.id];
      var s = {vehicle:v, last:m||null, where:'in', locationId:m ? m.locationId : null, since:m ? m.at : null, driverId:'', driverName:'', purpose:''};
      if(m && m.direction === 'out'){
        s.where = 'out'; s.driverId = m.driverId||''; s.driverName = m.driverName||''; s.purpose = m.purpose||'';
        s.outMs = now - toDate(m.at).getTime(); s.late = s.outMs > overdueMs;
      }
      live[v.id] = s;
    });

    // العداد الحالي: أعلى قراءة معروفة
    var odo = {};
    S.vehicles.forEach(function(v){ odo[v.id] = num(v.odometer); });
    S.movements.forEach(function(m){ if(m.odometer && odo[m.vehicleId] !== undefined) odo[m.vehicleId] = Math.max(odo[m.vehicleId], num(m.odometer)); });
    S.requests.forEach(function(r){ if(r.odometer && r.status !== 'rejected' && odo[r.vehicleId] !== undefined) odo[r.vehicleId] = Math.max(odo[r.vehicleId], num(r.odometer)); });

    // معدل استهلاك الوقود (كم/لتر) — طريقة الخزان الممتلئ: المسافة منذ التعبئة السابقة ÷ لترات هذه التعبئة
    var fuelEff = {}, vehicleAvg = {};
    var fuelByV = {};
    S.requests.forEach(function(r){
      if(r.type === 'fuel' && r.status !== 'rejected' && num(r.odometer) > 0 && num(r.liters) > 0) (fuelByV[r.vehicleId] = fuelByV[r.vehicleId] || []).push(r);
    });
    Object.keys(fuelByV).forEach(function(vid){
      var list = fuelByV[vid].sort(function(a,b){ return num(a.odometer) - num(b.odometer); });
      var dist = 0, lit = 0, n = 0;
      for(var i=1; i<list.length; i++){
        var d = num(list[i].odometer) - num(list[i-1].odometer);
        if(d <= 0) continue;
        var k = d / num(list[i].liters);
        fuelEff[list[i].id] = k; dist += d; lit += num(list[i].liters); n++;
      }
      if(n > 0) vehicleAvg[vid] = {kmpl:dist/lit, samples:n};
    });
    var fuelOver = {};
    Object.keys(fuelEff).forEach(function(rid){
      var r = S.requests.find(function(x){ return x.id === rid; });
      var avg = vehicleAvg[r.vehicleId];
      if(avg && avg.samples >= 3 && fuelEff[rid] < avg.kmpl * (1 - st.fuelOverusePct/100)) fuelOver[rid] = true;
    });

    derived = {vehicleMap:vehicleMap, driverMap:driverMap, trips:trips, live:live, odo:odo, fuelEff:fuelEff, vehicleAvg:vehicleAvg, fuelOver:fuelOver};
    return derived;
  }

  function currentOdo(vid){ return derived && derived.odo[vid] || 0; }

  /* نقاط السائق لشهر معيّن */
  function driverScore(driverId, mKey){
    var st = settings();
    var manual = S.points.filter(function(p){ return p.driverId === driverId && p.month === mKey && p.kind === 'manual'; });
    var manualSum = manual.reduce(function(a,p){ return a + num(p.delta); }, 0);
    var lateTrips = derived.trips.filter(function(t){ return t.driverId === driverId && t.late && monthKey(t.outAt) === mKey; });
    var overFuel = S.requests.filter(function(r){ return r.type === 'fuel' && r.driverId === driverId && derived.fuelOver[r.id] && monthKey(r.createdAt) === mKey; });
    var starRecs = S.points.filter(function(p){ return p.driverId === driverId && p.month === mKey && p.kind === 'stars'; })
      .sort(function(a,b){ return String(b.at).localeCompare(String(a.at)); });
    var trips = derived.trips.filter(function(t){ return t.driverId === driverId && monthKey(t.outAt) === mKey; });
    var total = st.startPoints + manualSum - lateTrips.length*st.latePenalty - overFuel.length*st.fuelPenalty;
    return {total:total, manual:manual, manualSum:manualSum, late:lateTrips, overFuel:overFuel, stars:starRecs[0] ? num(starRecs[0].stars) : 0, trips:trips};
  }

  /* التنبيهات */
  function computeAlerts(){
    var st = settings(), out = [];
    S.vehicles.forEach(function(v){
      var s = derived.live[v.id];
      if(s && s.where === 'out' && s.late) out.push({tone:'danger', icon:'⏰', vid:v.id, text:[el('b',{text:v.plate}),' خارج الجامعة منذ '+fmtDuration(s.outMs)+' مع '+driverLabel(s.driverId, s.driverName)]});
      [['registrationExpiry','السنوية'],['insuranceExpiry','التأمين']].forEach(function(p){
        var d = daysUntil(v[p[0]]);
        if(d === null) return;
        if(d < 0) out.push({tone:'danger', icon:'📄', vid:v.id, text:[el('b',{text:v.plate}),' انتهت '+p[1]+' منذ '+(-d)+' يوم ('+fmtDate(v[p[0]])+')']});
        else if(d <= st.expiryWarnDays) out.push({tone:'', icon:'📄', vid:v.id, text:[el('b',{text:v.plate}),' تنتهي '+p[1]+' خلال '+d+' يوم ('+fmtDate(v[p[0]])+')']});
      });
      if(num(v.lastOilChangeKm) > 0 && st.oilChangeKm > 0){
        var since = currentOdo(v.id) - num(v.lastOilChangeKm);
        if(since >= st.oilChangeKm) out.push({tone:'', icon:'🛢️', vid:v.id, text:[el('b',{text:v.plate}),' تجاوزت موعد تبديل الدهن ('+fmtNum(since)+' كم منذ آخر تبديل)']});
      }
    });
    return out;
  }

  /* ---------------- writes + audit ---------------- */
  function actor(){ return {by:S.authUser ? S.authUser.uid : '', byName:S.profile ? S.profile.name : ''}; }
  function audit(action, collection, docId, details){
    if(!db || !S.authUser) return;
    var a = actor();
    db.collection('audit').add({action:action, collection:collection, docId:docId||'', details:details||'', by:a.by, byName:a.byName, at:nowISO()})
      .catch(function(e){ console.warn('audit failed', e); });
  }
  /* يعرض رسالة النجاح فوراً عند انقطاع الإنترنت (الكتابة تُحفظ محلياً وتُزامن لاحقاً) */
  function commit(promise, okMsg){
    if(!navigator.onLine){
      showToast('حُفظ على الجهاز — سيُزامَن تلقائياً عند عودة الاتصال');
      promise.catch(function(e){ console.error(e); showToast('تعذّر الحفظ: '+errMsg(e)); });
      return Promise.resolve();
    }
    return promise.then(function(r){ if(okMsg) showToast(okMsg); return r; })
      .catch(function(e){ console.error(e); showToast('تعذّر الحفظ: '+errMsg(e)); throw e; });
  }
  function errMsg(e){
    var c = e && (e.code || e.message) || '';
    if(/permission/i.test(c)) return 'لا تملك صلاحية هذا الإجراء';
    if(/invalid-credential|wrong-password|user-not-found|invalid-login/i.test(c)) return 'اسم المستخدم أو كلمة المرور غير صحيحة';
    if(/email-already-in-use/.test(c)) return 'اسم المستخدم مستخدم مسبقاً';
    if(/weak-password/.test(c)) return 'كلمة المرور قصيرة (6 أحرف على الأقل)';
    if(/too-many-requests/.test(c)) return 'محاولات كثيرة — انتظر قليلاً ثم أعد المحاولة';
    if(/network/i.test(c)) return 'مشكلة في الاتصال بالإنترنت';
    return c || 'خطأ غير معروف';
  }
  function stamp(data){ var a = actor(); data.createdAt = data.createdAt || nowISO(); data.createdBy = a.by; data.createdByName = a.byName; return data; }
  function configDoc(){ return db.doc('config/general'); }

  /* ---------------- modal + form builder ---------------- */
  function openModal(opts){
    var root = $('modalRoot');
    var back = el('div',{class:'modal-backdrop'});
    var box = el('div',{class:'modal'+(opts.wide ? ' modal-wide' : ''), role:'dialog', 'aria-modal':'true', 'aria-label':opts.title});
    function close(){ if(back.parentNode) root.removeChild(back); }
    box.appendChild(el('div',{class:'modal-head'},[
      el('h3',{text:opts.title}),
      el('button',{class:'btn btn-sm btn-ghost', type:'button', 'aria-label':'إغلاق', text:'✕', onclick:close})
    ]));
    appendKids(box, opts.body || []);
    if(opts.actions && opts.actions.length){
      box.appendChild(el('div',{class:'row'}, opts.actions.map(function(a){
        return el('button',{class:'btn '+(a.cls||''), type:'button', text:a.label, onclick:function(){ a.onClick(close); }});
      })));
    }
    back.appendChild(box);
    back.addEventListener('mousedown', function(e){ if(e.target === back) close(); });
    root.appendChild(back);
    var first = box.querySelector('input:not([type=hidden]):not([type=file]), select, textarea');
    if(first && !opts.noFocus && window.matchMedia('(min-width:561px)').matches) setTimeout(function(){ first.focus(); }, 30);
    return close;
  }
  function confirmModal(title, message, okLabel, onOk, danger){
    openModal({title:title, body:[el('p',{class:'muted', text:message})], actions:[
      {label:okLabel || 'تأكيد', cls:danger ? 'btn-danger' : 'btn-primary', onClick:function(close){ close(); onOk(); }},
      {label:'إلغاء', cls:'btn-ghost', onClick:function(close){ close(); }}
    ]});
  }

  /* fields: [{key,label,type,options,value,required,placeholder,full,help,min,step,list,onChange,accept}] */
  function formModal(opts){
    var inputs = {}, wraps = {};
    var errBox = el('div',{class:'error-text', role:'alert'});
    var form = el('form',{novalidate:'novalidate'});
    var grid = el('div',{class:'form-grid'});
    var ctx = {
      get:function(k){ return readField(opts.fields.find(function(f){ return f.key === k; }), inputs[k]); },
      set:function(k,v){ var i = inputs[k]; if(!i) return; if(i.type === 'checkbox') i.checked = !!v; else i.value = v === undefined || v === null ? '' : v; },
      show:function(k, on){ if(wraps[k]) wraps[k].hidden = !on; },
      error:function(m){ errBox.textContent = m || ''; }
    };
    opts.fields.forEach(function(f){
      var id = 'f_'+f.key+'_'+uid();
      var input;
      if(f.type === 'select'){
        input = el('select',{id:id, name:f.key}, (f.options||[]).map(function(o){
          return el('option',{value:o.value, text:o.label, selected:String(o.value) === String(f.value === undefined ? '' : f.value)});
        }));
      } else if(f.type === 'textarea'){
        input = el('textarea',{id:id, name:f.key, placeholder:f.placeholder||'', value:f.value||''});
      } else if(f.type === 'checks'){
        var vals = f.value || [];
        input = el('div',{class:'checks', id:id}, (f.options||[]).map(function(o){
          return el('label',{},[el('input',{type:'checkbox', value:o.value, checked:vals.indexOf(o.value) >= 0}), o.label]);
        }));
      } else if(f.type === 'file'){
        input = el('input',{id:id, name:f.key, type:'file', accept:f.accept || 'image/*'});
        if(f.capture) input.setAttribute('capture', 'environment');
      } else if(f.type === 'toggle'){
        input = el('input',{id:id, name:f.key, type:'checkbox', checked:!!f.value});
      } else {
        input = el('input',{id:id, name:f.key, type:f.type || 'text', placeholder:f.placeholder||'', autocomplete:f.autocomplete||'off',
          value:f.value === undefined || f.value === null ? '' : String(f.value), min:f.min, max:f.max, step:f.step, inputmode:f.inputmode});
        if(f.list){
          var lid = id+'_list';
          input.setAttribute('list', lid);
          grid.appendChild(el('datalist',{id:lid}, f.list.map(function(s){ return el('option',{value:s}); })));
        }
      }
      if(f.onChange) input.addEventListener(f.type === 'checks' || f.type === 'select' || f.type === 'file' || f.type === 'toggle' ? 'change' : 'input', function(){ f.onChange(ctx.get(f.key), ctx); });
      inputs[f.key] = input;
      var labelNode = f.type === 'toggle'
        ? el('label',{'for':id, style:{display:'flex', gap:'8px', alignItems:'center', fontSize:'14px', color:'var(--ink)'}},[input, f.label])
        : el('label',{'for':id, text:f.label + (f.required ? ' *' : '')});
      var wrap = el('div',{class:'field'+(f.full || f.type === 'textarea' || f.type === 'checks' ? ' full' : '')},
        f.type === 'toggle' ? [labelNode] : [labelNode, input, f.help ? el('span',{class:'help', text:f.help}) : null]);
      if(f.hidden) wrap.hidden = true;
      wraps[f.key] = wrap;
      grid.appendChild(wrap);
    });
    var submitBtn = el('button',{class:'btn btn-primary btn-lg', type:'submit', text:opts.submitLabel || 'حفظ'});
    appendKids(form, [grid, errBox, el('div',{class:'row'},[submitBtn])]);
    var close = openModal({title:opts.title, wide:opts.wide, body:[opts.intro ? el('p',{class:'muted', text:opts.intro}) : null, form]});
    form.addEventListener('submit', function(e){
      e.preventDefault();
      errBox.textContent = '';
      var values = {}, missing = [];
      opts.fields.forEach(function(f){
        if(wraps[f.key].hidden){ values[f.key] = f.type === 'number' ? null : ''; return; }
        var v = readField(f, inputs[f.key]);
        values[f.key] = v;
        if(f.required && (v === '' || v === null || (Array.isArray(v) && !v.length))) missing.push(f.label);
      });
      if(missing.length){ errBox.textContent = 'حقول مطلوبة: '+missing.join('، '); return; }
      submitBtn.disabled = true;
      Promise.resolve().then(function(){ return opts.onSubmit(values, ctx); }).then(function(res){
        if(res === false){ submitBtn.disabled = false; return; }
        close();
      }).catch(function(err){
        submitBtn.disabled = false;
        errBox.textContent = typeof err === 'string' ? err : errMsg(err);
      });
    });
    if(opts.onOpen) opts.onOpen(ctx);
    return ctx;
  }
  function readField(f, input){
    if(!f || !input) return '';
    if(f.type === 'checks') return Array.prototype.slice.call(input.querySelectorAll('input:checked')).map(function(c){ return c.value; });
    if(f.type === 'file') return input.files && input.files[0] || null;
    if(f.type === 'toggle') return !!input.checked;
    if(f.type === 'number'){ var t = String(input.value).trim(); return t === '' ? null : Number(t); }
    return String(input.value).trim();
  }
  function opt(value, label){ return {value:value, label:label}; }
  function mapOptions(obj){ return Object.keys(obj).map(function(k){ return opt(k, obj[k]); }); }
  function vehicleOptions(placeholder){
    return [opt('', placeholder || 'اختر العجلة...')].concat(S.vehicles.slice().sort(byPlate).map(function(v){ return opt(v.id, vehicleLabel(v)); }));
  }
  function driverOptions(placeholder){
    return [opt('', placeholder || 'اختر السائق...')].concat(activeDrivers().map(function(d){ return opt(d.id, d.name); }));
  }
  function activeDrivers(){ return S.drivers.filter(function(d){ return d.active !== false; }).sort(function(a,b){ return a.name.localeCompare(b.name,'ar'); }); }
  function byPlate(a,b){ return String(a.plate).localeCompare(String(b.plate),'ar'); }
  function resolveDriver(name){
    var n = normName(name);
    if(!n) return {driverId:'', driverName:''};
    var d = S.drivers.find(function(x){ return normName(x.name) === n; });
    return d ? {driverId:d.id, driverName:d.name} : {driverId:'', driverName:String(name).trim()};
  }

  /* ---------------- الصور: ضغط داخل المتصفح (نحو 150KB) وحفظها في Firestore ---------------- */
  function compressImage(file, maxBytes){
    maxBytes = maxBytes || 150*1024;
    return new Promise(function(resolve, reject){
      if(!file) return resolve(null);
      if(!/^image\//.test(file.type)) return reject('الملف المختار ليس صورة');
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        URL.revokeObjectURL(url);
        var maxDim = 1280, q = 0.8, data = '';
        for(var attempt = 0; attempt < 8; attempt++){
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.width*scale)); c.height = Math.max(1, Math.round(img.height*scale));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          data = c.toDataURL('image/jpeg', q);
          if(data.length*0.75 <= maxBytes) break;
          if(q > 0.5) q -= 0.15; else maxDim = Math.round(maxDim*0.75);
        }
        resolve(data);
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject('تعذّر قراءة الصورة'); };
      img.src = url;
    });
  }
  function saveAttachment(file, kind){
    if(!file) return Promise.resolve('');
    return compressImage(file).then(function(data){
      var ref = db.collection('attachments').doc();
      var p = ref.set(stamp({data:data, kind:kind}));
      if(!navigator.onLine) return ref.id;
      return p.then(function(){ return ref.id; });
    });
  }
  function showAttachment(id, title){
    if(!id) return;
    db.collection('attachments').doc(id).get().then(function(s){
      if(!s.exists){ showToast('المرفق غير موجود'); return; }
      openModal({title:title || 'المرفق', body:[el('img',{class:'photo', src:s.data().data, alt:title||'مرفق', style:{maxHeight:'70vh', width:'100%'}})]});
    }).catch(function(e){ showToast('تعذّر تحميل المرفق: '+errMsg(e)); });
  }

  /* ---------------- theme + network ---------------- */
  function applyTheme(){
    var t = '';
    try{ t = localStorage.getItem('ameed_vehicles_theme') || ''; }catch(e){}
    if(t) document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme');
    $('themeBtn').textContent = t === 'dark' ? '☾' : t === 'light' ? '☀' : '◐';
  }
  function cycleTheme(){
    var t = ''; try{ t = localStorage.getItem('ameed_vehicles_theme') || ''; }catch(e){}
    t = t === '' ? 'light' : t === 'light' ? 'dark' : '';
    try{ localStorage.setItem('ameed_vehicles_theme', t); }catch(e){}
    applyTheme();
  }
  function updateNet(){
    $('netDot').className = 'dot' + (navigator.onLine ? '' : ' offline');
    $('netDot').title = navigator.onLine ? 'متصل' : 'غير متصل — تُحفظ الحركات على الجهاز';
  }

  /* ---------------- init ---------------- */
  var profileUnsub = null, dataStarted = false, renderTimer = null, screen = '';

  function init(){
    applyTheme(); updateNet();
    $('themeBtn').addEventListener('click', cycleTheme);
    $('logoutBtn').addEventListener('click', function(){ auth.signOut(); });
    window.addEventListener('online', updateNet);
    window.addEventListener('offline', updateNet);

    if(DEMO){
      FB = window.__demoFirebase || makeDemoFirebase();
      $('demoBanner').hidden = false;
    } else {
      FB = window.firebase;
      if(!FB || !FB.firestore || !FB.auth){
        clear($('main')).appendChild(el('div',{class:'card'},[el('p',{class:'error-text', text:'تعذّر تحميل مكتبات Firebase — تحقّق من الاتصال بالإنترنت ثم أعد تحميل الصفحة.'})]));
        return;
      }
    }
    app = FB.apps.length ? FB.app() : FB.initializeApp(firebaseConfig);
    auth = app.auth(); db = app.firestore();
    if(!DEMO){
      // حفظ البيانات على الجهاز لموظف الاستعلامات عند ضعف الإنترنت
      try{ db.enablePersistence({synchronizeTabs:true}).catch(function(e){ console.warn('persistence', e && e.code); }); }catch(e){}
    }
    if(DEMO && !(FB._store().cols.config || {}).general) seedDemoMode();

    configDoc().onSnapshot(function(s){
      S.config = s.exists ? s.data() : null; S.configLoaded = true; scheduleRender();
    }, function(e){ console.error(e); S.configLoaded = true; scheduleRender(); });

    auth.onAuthStateChanged(function(user){
      S.authUser = user; S.profile = null; S.profileLoaded = false;
      if(profileUnsub){ profileUnsub(); profileUnsub = null; }
      stopData();
      if(user){
        profileUnsub = db.collection('users').doc(user.uid).onSnapshot(function(s){
          S.profile = s.exists ? Object.assign({id:s.id}, s.data()) : null;
          S.profileLoaded = true;
          if(S.profile && S.profile.active !== false) startData();
          scheduleRender();
        }, function(e){ console.error(e); S.profileLoaded = true; scheduleRender(); });
      }
      scheduleRender();
    });
    if('serviceWorker' in navigator && location.protocol === 'https:'){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }
    render();
  }

  function snapToList(snap){ var out = []; snap.forEach(function(d){ out.push(Object.assign({id:d.id}, d.data())); }); return out; }
  function startData(){
    if(dataStarted) return;
    dataStarted = true;
    var map = {users:'users', vehicles:'vehicles', drivers:'drivers', movements:'movements', requests:'requests', driverPoints:'points'};
    if(isAdmin()) map.audit = 'audit';
    Object.keys(map).forEach(function(col){
      S.unsub.push(db.collection(col).onSnapshot(function(snap){
        S[map[col]] = snapToList(snap);
        scheduleRender();
      }, function(e){ console.error(col, e); }));
    });
  }
  function stopData(){
    S.unsub.forEach(function(u){ try{ u(); }catch(e){} });
    S.unsub = []; dataStarted = false;
    ['users','vehicles','drivers','movements','requests','points','audit'].forEach(function(k){ S[k] = []; });
  }

  function scheduleRender(){
    if(renderTimer) return;
    renderTimer = setTimeout(function(){ renderTimer = null; render(); }, 30);
  }

  /* يحدد الشاشة المطلوبة، ويعيد بناءها فقط عند تغيّرها (حتى لا تُمسح النماذج أثناء الكتابة) */
  function render(){
    var want;
    if(!S.configLoaded) want = 'loading';
    else if(!S.authUser) want = S.config ? 'login' : 'setup';
    else if(!S.profileLoaded) want = 'loading';
    else if(!S.profile || S.profile.active === false) want = 'blocked';
    else want = 'app';

    $('logoutBtn').hidden = !S.authUser;
    $('roleLabel').textContent = S.profile ? (ROLE_LABEL[S.profile.role] || S.profile.role) + ' — ' + S.profile.name : 'غير مسجّل';

    if(want !== 'app'){
      $('tabs').hidden = true;
      if(want !== screen){
        screen = want;
        var m = clear($('main'));
        if(want === 'loading') m.appendChild(el('div',{class:'card'},[el('p',{class:'muted', text:'⏳ جارٍ الاتصال بقاعدة البيانات...'})]));
        else if(want === 'login') m.appendChild(buildLogin());
        else if(want === 'setup') m.appendChild(buildSetup());
        else if(want === 'blocked') m.appendChild(el('div',{class:'card login-wrap'},[
          el('h2',{text:'الحساب غير مفعّل'}),
          el('p',{class:'muted', text:'هذا الحساب غير مرتبط بصلاحية في النظام أو أوقفه مدير النظام. راجع مدير النظام.'}),
          el('button',{class:'btn', type:'button', text:'تسجيل الخروج', onclick:function(){ auth.signOut(); }})
        ]));
      }
      return;
    }
    computeDerived();
    var tabs = tabsForRole();
    if(tabs.indexOf(S.tab) < 0) S.tab = tabs[0];

      var panel = el('section',{class:'panel', id:'panel-'+S.tab});

  function openMovementForm(vid, dir){
    var locs = allowedLocations();
    if(!locs.length){ showToast('لم يُحدَّد لك موقع — راجع مدير النظام'); return; }
    if(!S.vehicles.length){ showToast('لا توجد عجلات مسجّلة'); return; }
    var confirmKey = '';
    function defaults(ctx, id, d){
      var v = vehicleById(id), s = id && derived.live[id];
      if(!v) return;
      if(!d){ d = s && s.where === 'out' ? 'in' : 'out'; ctx.set('direction', d); }
      var drv = d === 'in' && s && s.where === 'out' ? driverLabel(s.driverId, s.driverName) : driverLabel(v.defaultDriverId, '');
      ctx.set('driver', drv === '—' ? '' : drv);
      ctx.show('purpose', d === 'out');
      ctx.error('');
      ctx.set('odometer', '');
      var odoField = document.querySelector('.modal input[name=odometer]');
      if(odoField) odoField.placeholder = 'آخر قراءة: '+fmtNum(currentOdo(id));
    }
    formModal({
      title:dir === 'in' ? 'تسجيل دخول عجلة' : dir === 'out' ? 'تسجيل خروج عجلة' : 'تسجيل حركة',
      submitLabel:'تسجيل الحركة',
      fields:[
        {key:'vehicleId', label:'العجلة', type:'select', options:vehicleOptions(), value:vid, required:true, onChange:function(v, ctx){ defaults(ctx, v, ''); }},
        {key:'direction', label:'الاتجاه', type:'select', options:[opt('out','خروج من الجامعة'), opt('in','دخول إلى الجامعة')], value:dir || 'out', required:true,
          onChange:function(d, ctx){ defaults(ctx, ctx.get('vehicleId'), d); }},
        {key:'driver', label:'السائق الفعلي', list:activeDrivers().map(function(d){ return d.name; }), placeholder:'اختر أو اكتب اسم سائق', help:'يمكن كتابة اسم سائق من خارج القائمة'},
        {key:'locationId', label:'الموقع / البوابة', type:'select', options:locs.map(function(l){ return opt(l.id, l.name); }), value:locs[0].id, required:true},
        {key:'odometer', label:'قراءة العداد (اختياري)', type:'number', min:0, inputmode:'numeric'},
        {key:'purpose', label:'الوجهة أو الغرض', placeholder:'مثال: مهمة رسمية إلى بغداد', hidden:dir === 'in'},
        {key:'note', label:'ملاحظة', type:'textarea'}
      ],
      onOpen:function(ctx){ if(vid) defaults(ctx, vid, dir); },
      onSubmit:function(vals, ctx){
        var v = vehicleById(vals.vehicleId), s = derived.live[vals.vehicleId];
        if(!v) throw 'اختر العجلة';
        if(locs.map(function(l){ return l.id; }).indexOf(vals.locationId) < 0) throw 'لا تملك صلاحية التسجيل في هذا الموقع';
        if(vals.direction === 'out' && !vals.driver) throw 'اكتب اسم السائق الذي خرج بالعجلة';

  /* ====================================================================
     التقارير: كل تقرير يُبنى كوصف بيانات {title, meta, stats, sections}
     ثم يُعرض قابلاً للطباعة بـ buildReportHead() ويُصدَّر إلى Excel.
     الخلية إما نص/رقم أو {v: قيمة خام لـ Excel, t: نص العرض}.
     ==================================================================== */
  function buildReportHead(titleText){
    var logo = el('div',{class:'report-logo'},[
      el('img',{class:'report-logo-light', src:'assets/logo-light.png', alt:'شعار جامعة العميد'}),
      el('img',{class:'report-logo-dark', src:'assets/logo-dark.png', alt:'شعار جامعة العميد'})
    ]);
    return el('div',{class:'report-head'},[
      logo,
      el('div',{class:'report-titles'},[
        el('div',{class:'report-univ', text:'جامعة العميد'}),
        el('div',{class:'report-sub', text:'الشؤون الإدارية والقانونية — شعبة الآليات'}),
        el('div',{class:'report-title', text:titleText})
      ])
    ]);
  }
  function cIQD(n){ return {v:Math.round(num(n)), t:fmtIQD(n)}; }
  function cNum(n, d){ return {v:d ? Math.round(num(n)*10)/10 : Math.round(num(n)), t:fmtNum(n, d)}; }
  function cellText(c){ return c && typeof c === 'object' ? c.t : (c === null || c === undefined || c === '' ? '—' : String(c)); }
  function cellValue(c){ return c && typeof c === 'object' ? c.v : (c === null || c === undefined ? '' : stripIsolates(c)); }
  function sumBy(list, f){ return list.reduce(function(a,x){ return a + num(f(x)); }, 0); }
  function doneAt(r){ return r.doneAt || r.updatedAt || r.createdAt; }

  function renderReport(spec, container){
    clear(container);
    var sheet = el('div',{class:'card report-sheet', id:'printableReport'});
    sheet.appendChild(el('div',{class:'row no-print', id:'reportPrintRow'},[
      el('button',{class:'btn btn-primary', type:'button', id:'printReportBtn', text:'🖨 طباعة', onclick:function(){ window.print(); }}),
      el('button',{class:'btn', type:'button', id:'excelReportBtn', text:'📊 تصدير Excel', onclick:function(){ exportReportExcel(spec); }})
    ]));
    sheet.appendChild(buildReportHead(spec.title));
    if(spec.meta && spec.meta.length) sheet.appendChild(el('div',{class:'report-meta'}, spec.meta.map(function(m){ return el('span',{},[el('b',{text:m[0]+': '}), cellText(m[1])]); })));
    if(spec.stats && spec.stats.length) sheet.appendChild(el('div',{class:'report-stats'}, spec.stats.map(function(s){
      return el('div',{class:'stat-box'+(s.total ? ' stat-total' : '')},[el('div',{class:'stat-num', text:cellText(s.value)}), el('div',{class:'stat-label', text:s.label})]);
    })));
    (spec.sections || []).forEach(function(sec){
      sheet.appendChild(el('div',{class:'report-section-title', text:sec.title+' ('+sec.rows.length+')'}));
      if(!sec.rows.length){ sheet.appendChild(emptyNote('لا توجد بيانات ضمن هذه الفترة.')); return; }
      sheet.appendChild(tableNode(sec.headers, sec.rows.map(function(r){ return r.map(cellText); }), {foot:sec.foot ? sec.foot.map(cellText) : null}));
    });
    sheet.appendChild(el('div',{class:'faint', text:'أُعدّ بتاريخ '+fmtDT(new Date())+' بواسطة '+(S.profile ? S.profile.name : '')}));
    sheet.appendChild(el('div',{class:'report-sign'},[el('div',{text:'مدير الآليات'}), el('div',{text:'المالية'}), el('div',{text:'مساعد رئيس الجامعة للشؤون الإدارية'})]));
    container.appendChild(sheet);
    container.hidden = false;
  }
  function exportReportExcel(spec){
    if(!window.XLSX){ showToast('مكتبة Excel لم تُحمَّل — تحقّق من الاتصال'); return; }
    var wb = XLSX.utils.book_new();
    wb.Workbook = {Views:[{RTL:true}]};
    var summary = [[spec.title], []];
    (spec.meta || []).forEach(function(m){ summary.push([m[0], cellValue(m[1])]); });
    summary.push([]);
    (spec.stats || []).forEach(function(s){ summary.push([s.label, cellValue(s.value)]); });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summary), 'الملخص');
    var used = {'الملخص':1};
    (spec.sections || []).forEach(function(sec){
      var name = sec.title.replace(/[\\\/\?\*\[\]:]/g,' ').slice(0, 28), n = name, i = 2;
      while(used[n]) n = name.slice(0, 26)+' '+(i++);
      used[n] = 1;
      var rows = [sec.headers].concat(sec.rows.map(function(r){ return r.map(cellValue); }));
      if(sec.foot) rows.push(sec.foot.map(cellValue));
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), n);
    });
    // اسم ملف لاتيني: بعض المتصفحات تتجاهل الأسماء العربية عند التنزيل
    XLSX.writeFile(wb, 'ameed-'+(spec.fileName || 'report')+'-'+fmtISODate(new Date())+'.xlsx');
  }

  function vehicleReportSpec(vid, from, to){
    var v = vehicleById(vid);
    var reqs = S.requests.filter(function(r){ return r.vehicleId === vid && inRange(r.createdAt, from, to); }).sort(function(a,b){ return String(a.createdAt).localeCompare(String(b.createdAt)); });
    var live = reqs.filter(function(r){ return r.status !== 'rejected'; });
    var fuel = live.filter(function(r){ return r.type === 'fuel'; });
    var maint = live.filter(function(r){ return r.type === 'maintenance'; });
    var wash = live.filter(function(r){ return r.type === 'wash'; });
    var done = live.filter(function(r){ return r.status === 'done'; });
    var trips = derived.trips.filter(function(t){ return t.vehicleId === vid && inRange(t.outAt, from, to); }).sort(function(a,b){ return String(a.outAt).localeCompare(String(b.outAt)); });

  function parseImportSheet(ws, kind){
    var rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true});
    if(!rows.length) return [];
    var head = rows[0].map(function(h){ return normName(h); });
    var idx = {};
    IMPORT_COLS[kind].forEach(function(c){ idx[c[0]] = head.indexOf(normName(c[1])); });
    return rows.slice(1).filter(function(r){ return r.some(function(c){ return String(c).trim() !== ''; }); }).map(function(r){
      var o = {};
      Object.keys(idx).forEach(function(k){
        var v = idx[k] >= 0 ? r[idx[k]] : '';
        if(v instanceof Date) v = fmtISODate(v);
        o[k] = String(v === null || v === undefined ? '' : v).trim();
      });
      return o;
    });
  }

  function commitImport(drivers, vehicles){
    var nameToId = {};
    S.drivers.forEach(function(d){ nameToId[normName(d.name)] = d.id; });
    var ops = [];
    drivers.forEach(function(d){
      var ref = db.collection('drivers').doc();
      nameToId[normName(d.name)] = ref.id;
      ops.push([ref, stamp({name:d.name, phone:d.phone, licenseNo:d.licenseNo, licenseExpiry:d.licenseExpiry, notes:d.notes, active:true, imported:true})]);
    });
    vehicles.forEach(function(v){
      ops.push([db.collection('vehicles').doc(), stamp({plate:v.plate, province:v.province, make:v.make, model:v.model, year:v.year ? Number(v.year) || v.year : '', color:v.color, chassis:v.chassis,
        fuelType:v.fuelType, odometer:num(v.odometer), registrationExpiry:v.registrationExpiry, insuranceExpiry:v.insuranceExpiry, department:v.department,
        defaultDriverId:nameToId[normName(v.defaultDriver)] || '', notes:v.notes, status:'active', imported:true})]);
    });
    audit('import.excel', 'vehicles', '', drivers.length+' سائق، '+vehicles.length+' عجلة');
    return writeInBatches(ops.map(function(o){ return {type:'set', ref:o[0], data:o[1]}; }));
  }
  function writeInBatches(ops){
    var chunks = [];
    for(var i=0; i<ops.length; i+=400) chunks.push(ops.slice(i, i+400));
    return chunks.reduce(function(p, chunk){
      return p.then(function(){
        var b = db.batch();
        chunk.forEach(function(o){ if(o.type === 'delete') b['delete'](o.ref); else b.set(o.ref, o.data); });
        var c = b.commit();
        return navigator.onLine ? c : null;
      });
    }, Promise.resolve());
  }
