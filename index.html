        if(day.getDay() !== 5 && rnd() < 0.8){
          var drvIdx = rnd() < 0.75 ? s[7] : ri(0,5);
          var outAt = day.getTime(), dur = (rnd() < 0.07 ? ri(13,20) : ri(1,7))*3600000 + ri(0,59)*60000;
          var km = ri(15, dur > 5*3600000 ? 260 : 90);
          var loc = pick(['gate-main','gate-main','gate-back']);
          movements.push(Object.assign({id:'demo-mov-'+i+'-'+outAt, vehicleId:id, direction:'out', driverId:'demo-drv-'+drvIdx, driverName:names[drvIdx], locationId:loc, at:new Date(outAt).toISOString(), odometer:odo, purpose:pick(purposes), note:'', by:who('u_gate'), byName:'موظف الاستعلامات (تجريبي)'}, stamp0));
          odo += km; sinceFuel += km;
          var inAt = outAt + dur;
          if(inAt > now - 10*60000){ lastDir = 'out'; break; } // ما زالت خارج الجامعة
          lastDir = 'in'; lastAt = inAt;
          movements.push(Object.assign({id:'demo-mov-'+i+'-'+inAt, vehicleId:id, direction:'in', driverId:'demo-drv-'+drvIdx, driverName:names[drvIdx], locationId:'garage', at:new Date(inAt).toISOString(), odometer:odo, purpose:'', note:'', by:who('u_gate'), byName:'موظف الاستعلامات (تجريبي)'}, stamp0));
          if(sinceFuel > 250){
            var liters = Math.round(sinceFuel / (kmpl * (rnd() < 0.1 ? 0.6 : 0.9 + rnd()*0.2)));
            var price = s[5] === 'diesel' ? 500 : 650;
            var fAt = new Date(inAt + 20*60000).toISOString();
            var age = now - (inAt + 20*60000);
            var st = age > 5*DAY ? 'done' : age > 2*DAY ? (rnd() < 0.5 ? 'done' : 'awaiting_finance') : (rnd() < 0.5 ? 'new' : 'awaiting_finance');
            var hist = [{status:'new', at:fAt, by:'u_driver', byName:names[drvIdx], note:''}];
            if(st !== 'new') hist.push({status:'awaiting_finance', at:new Date(inAt + 3*3600000).toISOString(), by:'u_fleet', byName:'مدير الآليات (تجريبي)', note:'موافقة مدير الآليات'});
            if(st === 'done') hist.push({status:'done', at:new Date(inAt + DAY).toISOString(), by:'u_finance', byName:'موظف المالية (تجريبي)', note:'تأييد المالية'});
            requests.push(Object.assign({id:'demo-req-f-'+i+'-'+inAt, type:'fuel', vehicleId:id, driverId:'demo-drv-'+drvIdx, driverName:names[drvIdx], status:st, history:hist,
              fuelType:s[5], liters:liters, amount:liters*price, odometer:odo, station:pick(['محطة الحسين','محطة العباس','محطة طريق بغداد']), payMethod:pick(['cash','coupon','account']),
              createdAt:fAt, doneAt:st === 'done' ? hist[2].at : undefined, financeApprovedAmount:st === 'done' ? liters*price : undefined, financeBy:st === 'done' ? 'موظف المالية (تجريبي)' : undefined}, stamp0));
            sinceFuel = 0;
          }
        }
        t += DAY;
      }
      // حالات عرض: عجلتان خارج الجامعة الآن، وعجلة متأخرة عن الإرجاع (خرجت قبل 15 ساعة)
      var forceOut = {0:3, 3:5, 6:15}[i];
      if(forceOut && lastDir === 'in' && lastAt < now - forceOut*3600000){
        var fo = now - forceOut*3600000;
        movements.push(Object.assign({id:'demo-mov-'+i+'-'+fo, vehicleId:id, direction:'out', driverId:'demo-drv-'+s[7], driverName:names[s[7]], locationId:'gate-main', at:new Date(fo).toISOString(), odometer:odo, purpose:pick(purposes), note:'', by:who('u_gate'), byName:'موظف الاستعلامات (تجريبي)'}, stamp0));
      }
    });
    // صيانة
    function req(id, type, vi, st, daysAgo, extra, histNotes){
      var at = new Date(now - daysAgo*DAY).toISOString(), v = specs[vi];
      var h = [{status:'new', at:at, by:'u_fleet', byName:'مدير الآليات (تجريبي)', note:''}];
      (histNotes || []).forEach(function(x, k){ h.push({status:x[0], at:new Date(now - (daysAgo - k*0.5 - 0.3)*DAY).toISOString(), by:x[1], byName:x[2], note:x[3] || ''}); });
      var r = Object.assign({id:id, type:type, vehicleId:'demo-veh-'+vi, driverId:'demo-drv-'+v[7], driverName:names[v[7]], status:st, history:h, createdAt:at}, stamp0, extra);
      if(st === 'done'){ r.doneAt = h[h.length-1].at; r.financeBy = 'موظف المالية (تجريبي)'; }
      requests.push(r);
    }
    var F = ['u_fleet','مدير الآليات (تجريبي)'], FI = ['u_finance','موظف المالية (تجريبي)'];
    req('demo-req-m-1','maintenance',4,'in_progress',4,{description:'صوت في ناقل الحركة وتسريب زيت', workshop:'ورشة الأمين', estCost:450000, odometer:95100},[['approved',F[0],F[1]],['in_progress',F[0],F[1]]]);
    req('demo-req-m-2','maintenance',1,'new',1,{description:'تبديل دهن وفلاتر — تجاوزت موعد التبديل', estCost:85000},[]);
    req('demo-req-m-3','maintenance',2,'done',18,{description:'تبديل بطارية', workshop:'مركز الكهرباء', estCost:120000, actualCost:115000},[['approved',F[0],F[1]],['in_progress',F[0],F[1]],['awaiting_finance',F[0],F[1]],['done',FI[0],FI[1],'تأييد المالية']]);
    req('demo-req-m-4','maintenance',5,'awaiting_finance',6,{description:'تصليح مكيف الهواء', workshop:'ورشة التبريد', estCost:200000, actualCost:175000},[['approved',F[0],F[1]],['in_progress',F[0],F[1]],['awaiting_finance',F[0],F[1]]]);
    req('demo-req-m-5','maintenance',6,'rejected',9,{description:'طلاء الباب الخلفي', estCost:300000, rejectReason:'ليس ضمن الأولويات هذا الشهر', rejectedBy:F[1]},[['rejected',F[0],F[1],'ليس ضمن الأولويات هذا الشهر']]);
    req('demo-req-m-6','maintenance',0,'done',12,{description:'تبديل إطارات أمامية', workshop:'إطارات الفرات', estCost:600000, actualCost:640000},[['approved',F[0],F[1]],['in_progress',F[0],F[1]],['awaiting_finance',F[0],F[1]],['done',FI[0],FI[1],'تأييد المالية']]);
    req('demo-req-w-1','wash',0,'done',3,{kind:'both', place:'مغسل الجامعة', cost:0},[['done',F[0],F[1],'أُنجز الغسل']]);
    req('demo-req-w-2','wash',3,'new',0.3,{kind:'wash', place:''},[]);
    req('demo-req-w-3','wash',7,'awaiting_finance',2,{kind:'clean', place:'مغسل الفرات', cost:15000},[['awaiting_finance',F[0],F[1],'أُنجز الغسل — بانتظار المالية']]);
    req('demo-req-w-4','wash',2,'done',10,{kind:'both', place:'مغسل الفرات', cost:20000},[['awaiting_finance',F[0],F[1]],['done',FI[0],FI[1],'تأييد المالية']]);
    var mk = monthKey(new Date());
    points.push(Object.assign({id:'demo-pts-1', driverId:'demo-drv-1', month:mk, kind:'manual', delta:-10, category:'violation', reason:'مخالفة سرعة (تجريبي)', by:who('u_fleet'), byName:F[1], at:new Date(now - 5*DAY).toISOString()}, stamp0));
    points.push(Object.assign({id:'demo-pts-2', driverId:'demo-drv-2', month:mk, kind:'manual', delta:5, category:'excellence', reason:'التزام متميز بالمواعيد (تجريبي)', by:who('u_fleet'), byName:F[1], at:new Date(now - 3*DAY).toISOString()}, stamp0));
    [5,3,4,4,5,3].forEach(function(n, i){ points.push(Object.assign({id:'demo-stars-'+i, driverId:'demo-drv-'+i, month:mk, kind:'stars', stars:n, reason:'', by:who('u_fleet'), byName:F[1], at:new Date(now - DAY).toISOString()}, stamp0)); });
    requests.forEach(function(r){ Object.keys(r).forEach(function(k){ if(r[k] === undefined) delete r[k]; }); });
    return {drivers:drivers, vehicles:vehicles, movements:movements, requests:requests, driverPoints:points};
  }
  function demoOps(){
    var data = buildDemoData(), ops = [];
    Object.keys(data).forEach(function(col){ data[col].forEach(function(d){ var id = d.id; var copy = Object.assign({}, d); delete copy.id; ops.push({type:'set', ref:db.collection(col).doc(id), data:copy}); }); });
    return ops;
  }
  function seedDemoMode(){
    var b = db.batch();
    b.set(configDoc(), {locations:DEFAULT_LOCATIONS, settings:DEFAULT_SETTINGS, createdAt:nowISO(), demo:true});
    DEMO_USERS.forEach(function(u){
      var id = 'u_'+u.username;
      FB._setAuthUser(usernameToEmail(u.username), id, 'demo1234');
      b.set(db.collection('users').doc(id), {username:u.username, name:u.name, role:u.role, locations:u.locations || [], driverId:u.driverKey !== undefined ? 'demo-drv-'+u.driverKey : '', active:true, createdAt:nowISO(), demo:true});
    });
    b.commit();
    writeInBatches(demoOps());
  }
  function addDemoData(){
    var ops = demoOps();
    audit('demo.add', '', '', ops.length+' مستند');
    commit(writeInBatches(ops), 'أُضيفت '+ops.length+' مستند تجريبي');
  }
  function deleteDemoData(){
    var ops = [];
    [['vehicles','vehicles'],['drivers','drivers'],['movements','movements'],['requests','requests'],['driverPoints','points']].forEach(function(p){
      S[p[1]].forEach(function(d){ if(d.demo === true) ops.push({type:'delete', ref:db.collection(p[0]).doc(d.id)}); });
    });
    if(!ops.length){ showToast('لا توجد بيانات تجريبية'); return; }
    confirmModal('حذف البيانات التجريبية', 'سيُحذف '+ops.length+' مستنداً معلَّماً بـ demo:true (عجلات، سائقون، حركات، طلبات، نقاط). البيانات الحقيقية لا تُمسّ. لا يمكن التراجع.', 'حذف '+ops.length+' مستند', function(){
      audit('demo.delete', '', '', ops.length+' مستند');
      commit(writeInBatches(ops), 'حُذفت البيانات التجريبية');
    }, true);
  }

  window.__ameedVehicles = {S:S, derived:function(){ return derived; }, DEMO:DEMO};
  init();
})();
</script>
